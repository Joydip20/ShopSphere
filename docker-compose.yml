services:
  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql

    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./ShopSphere-Backend
      dockerfile: Dockerfile

    container_name: shopsphere-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./ShopSphere-Frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:8080/api

    container_name: shopsphere-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  mysql_data:
